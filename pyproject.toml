[project]
name = "lean_prover"
version = "0.1.0"
description = "A Lean-arbitrated LLM agent for competition mathematics (Lean 4 + Mathlib, PutnamBench)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lean_prover"]
