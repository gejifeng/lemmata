[project]
name = "lemmata"
version = "0.2.0"
description = "A Lean-arbitrated LLM agent for mathematics: natural language -> Lean statement -> Lean-checked proof"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
lemmata = "lemmata.campaign:main"
lemmata-webui = "lemmata.webui:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lemmata"]

[tool.setuptools.package-data]
lemmata = ["web/*.html"]
